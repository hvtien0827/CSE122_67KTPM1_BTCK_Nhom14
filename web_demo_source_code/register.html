<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CourtConnect - Đặt sân, tìm trận, kết nối người chơi và điều phối câu lạc bộ thể thao."
    />
    <meta name="theme-color" content="#15803d" />
    <title>Tạo tài khoản | CourtConnect</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/navigation.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <script>
      window.PAGE_TITLE = 'Tạo tài khoản';
    </script>
    <script defer src="js/store.js"></script>
    <script defer src="js/ui.js"></script>
    <script defer src="js/views.js"></script>
    <script defer src="js/auth.js"></script>
    <script defer src="js/app.js"></script>
  </head>
  <body data-layout="auth" data-route="register.html">
    <!-- Điều hướng dùng chung; JavaScript chỉ cập nhật tài khoản và vai trò. --><a
      class="skip"
      href="#main"
      >Bỏ qua điều hướng</a
    >
    <header class="header">
      <div class="container header-inner">
        <div class="header-left">
          <button
            type="button"
            class="icon-btn sidebar-toggle-btn"
            data-session="member"
            hidden
            data-action="toggle-sidebar"
            aria-label="Menu điều hướng"
            aria-controls="site-navigation"
            aria-expanded="false"
          >
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M4 6h16M4 12h16M4 18h16" /></svg></button
          ><a class="brand" href="index.html"><span class="brand-icon">C</span>CourtConnect</a>
        </div>
        <nav class="auth-header-nav" aria-label="Điều hướng tài khoản">
          <button
            type="button"
            class="icon-btn theme-toggle"
            data-action="toggle-theme"
            aria-label="Chuyển sang giao diện tối"
            title="Chuyển sang giao diện tối"
            aria-pressed="false"
          >
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M20.9 13.1A9 9 0 0 1 10.9 3.1a9 9 0 1 0 10 10Z" /></svg>
          </button>
          <details class="account-menu" data-session="member" hidden>
            <summary aria-label="Tài khoản và đăng xuất">
              <span class="avatar" data-user-initial></span
              ><span class="user-name" data-user-name></span>
            </summary>
            <div class="account-dropdown">
              <strong data-user-name></strong><span class="small muted" data-user-role></span>
              <div class="account-menu-items">
                <a class="btn account-menu-item" data-user-home href="index.html"
                  ><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="m3 10 9-7 9 7M5 9v12h14V9M9 21v-8h6v8" /></svg >Trang của tôi</a
                ><a class="btn account-menu-item" href="profile.html"
                  ><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><circle cx="9" cy="8" r="3" /><path d="M3 20v-3a6 6 0 0 1 12 0v3M16 5a3 3 0 0 1 0 6m2 3a5 5 0 0 1 3 5" /></svg >Hồ sơ cá nhân</a
                ><a class="btn account-menu-item" href="settings.html"
                  ><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><circle cx="12" cy="12" r="3" /><path d="m9 3-1 3-3 1v3l-2 2 2 2v3l3 1 1 3h6l1-3 3-1v-3l2-2-2-2V7l-3-1-1-3Z" /></svg >Cài đặt</a
                ><button
                  type="button"
                  class="btn account-menu-item account-logout"
                  data-action="logout"
                >
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M9 4H4v16h5M13 8l4 4-4 4M8 12h12" /></svg >Đăng xuất / đổi vai trò
                </button>
              </div>
            </div>
          </details>
          <a href="index.html" class="small">← Về trang chủ</a>
        </nav>
      </div>
    </header>
    <main id="main" class="auth-main">
      <!-- Sửa bố cục, tiêu đề và form của trang tại đây. -->
      <div data-page-view="auth-register" class="page-content">
        <div class="auth-card">
          <div class="auth-top">
            <div class="auth-symbol">C</div>
            <h1>Tạo tài khoản</h1>
            <p>Khám phá cộng đồng và đặt sân nhanh chóng</p>
          </div>
          <form id="auth-form">
            <div id="auth-error" class="notice error" role="alert" hidden></div>
            <label class="field"
              >Họ và tên<input
                name="name"
                type="text"
                value=""
                required
                minlength="2"
                maxlength="80"
                autocomplete="name"
                placeholder="Nhập đầy đủ họ và tên" /></label
            ><label class="field"
              >Email<input
                name="email"
                type="email"
                value=""
                required
                autocomplete="email"
                placeholder="Nhập địa chỉ email"
                data-bind-attrs='{"value":"__CC_email__"}' /></label
            ><label class="field"
              >Mật khẩu<span class="password-wrap"
                ><input
                  type="password"
                  name="password"
                  required
                  minlength="8"
                  maxlength="80"
                  autocomplete="current-password"
                  placeholder="Ít nhất 8 ký tự, gồm chữ và số"
                /><button type="button" data-action="password">Hiện</button></span
              ></label
            ><label class="field"
              >Xác nhận mật khẩu<span class="password-wrap"
                ><input
                  type="password"
                  name="confirm"
                  required
                  minlength="8"
                  maxlength="80"
                  autocomplete="new-password"
                  placeholder="Ít nhất 8 ký tự, gồm chữ và số"
                /><button type="button" data-action="password">Hiện</button></span
              ></label
            ><label class="check"
              ><input type="checkbox" name="terms" required /><span
                >Tôi đồng ý với <a href="terms.html">Điều khoản sử dụng</a> và
                <a href="privacy.html">Chính sách bảo mật</a> của CourtConnect.</span
              ></label
            ><button class="btn full">Tạo tài khoản</button>
            <div class="or">Hoặc</div>
            <button type="button" class="btn secondary full" data-action="google">
              ⓖ Đăng ký bằng Google
            </button>
            <p class="auth-bottom">Đã có tài khoản? <a href="login.html">Đăng nhập</a></p>
          </form>
        </div>
      </div>
    </main>
    <footer class="auth-footer">
      <span>© 2026 CourtConnect. Tất cả quyền được bảo lưu.</span>
      <nav>
        <a href="terms.html">Điều khoản sử dụng</a><a href="privacy.html">Chính sách bảo mật</a
        ><a href="help.html">Hỗ trợ khách hàng</a>
      </nav>
    </footer>
    <noscript
      ><p class="notice">
        Bố cục trang có thể xem trực tiếp. Bật JavaScript để đăng nhập, tải dữ liệu và sử dụng chức
        năng.
      </p></noscript
    ><!-- Các hộp thoại của trang: sửa form trực tiếp trong template bên dưới. -->
    <dialog id="modal" aria-labelledby="dialog-title">
      <div class="dialog-head">
        <h2 id="dialog-title"></h2>
        <button type="button" class="icon-btn" data-action="close" aria-label="Đóng">×</button>
      </div>
      <div class="dialog-body"></div>
    </dialog>
    <template data-fragment="auth-renderAuth-dialog-1"
      ><p class="muted">
        Nguyên mẫu chưa kết nối Google OAuth. Bạn có thể dùng tài khoản mẫu hoặc đăng ký bằng email
        mô phỏng.
      </p>
      <div class="actions">
        <button type="button" class="btn" data-action="close">Đã hiểu</button>
      </div></template
    >

    <!-- Lịch dùng chung; JavaScript chỉ tạo danh sách ngày/năm. -->
  </body>
</html>
